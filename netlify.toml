[build]
  command = "pnpm --filter @hammercreative/web build"
  publish = "apps/web/.next"

[build.environment]
  NODE_VERSION = "24"
  PNPM_VERSION = "10.12.4"

# Branch deploys and deploy previews are non-production: noindex, preview robots.txt, and a
# preview-capable build. Set SANITY_API_PREVIEW_TOKEN (Viewer role) per context in the Netlify UI.
[context.production.environment]
  NEXT_PUBLIC_ENVIRONMENT = "production"

[context.deploy-preview.environment]
  NEXT_PUBLIC_ENVIRONMENT = "preview"

[context.branch-deploy.environment]
  NEXT_PUBLIC_ENVIRONMENT = "preview"

# Long-lived `preview` branch, served at preview.hammercreative.com: fetches Sanity drafts on every
# request. Set SANITY_API_PREVIEW_TOKEN (Viewer) for this branch in the Netlify UI; the token stays
# server-side. Never set NEXT_PUBLIC_SANITY_PREVIEW_SITE in the production context.
#
# The preview site is behind a per-person Clerk login (apps/web/src/middleware.preview.ts). Set these
# for the `preview` branch only: NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY, CLERK_SECRET_KEY,
# PREVIEW_ALLOWED_EMAILS (comma-separated emails or @domain), PREVIEW_COOKIE_SECRET (32+ random chars).
[context.preview.environment]
  NEXT_PUBLIC_ENVIRONMENT = "preview"
  NEXT_PUBLIC_SANITY_PREVIEW_SITE = "true"

[context."chore/sanity-6".environment]
  NEXT_PUBLIC_ENVIRONMENT = "preview"
  NEXT_PUBLIC_SANITY_PREVIEW_SITE = "true"

[dev]
  command = "pnpm --filter @hammercreative/web dev"
  framework = "#custom"
  targetPort = 3000
  port = 8888

[[plugins]]
  package = "@netlify/plugin-nextjs"
  pinned_version = "5.14.7"
